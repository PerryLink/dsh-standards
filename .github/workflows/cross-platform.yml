name: cross-platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 40-checker
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checker tests on ${{ matrix.os }}
        run: node --test test/*.test.mjs
