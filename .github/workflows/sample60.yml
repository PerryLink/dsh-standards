name: sample60-static

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample60:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 60 ENTRY static
        run: node 40-checker/scripts/sample60-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sample60-static
          path: results/sample60-ci
