<text x="600" y="318" fill="#1f2328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14">not-run != PASS - static != runtime - A-D != ENTRY/FLOW/BOOST</text>
<text x="60" y="378" fill="#57606a" font-family="ui-monospace,monospace" font-size="13">dsh-standards 1.x umbrella - checker 0.1.0 - L1-L3 run in an isolated child with a hard timeout; a kill is not-run, never a pass</text>
